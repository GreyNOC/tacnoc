name: CI

# This repository's default branch is `master`. The trigger said `main`, so the
# gate this workflow exists to enforce had never run on a single push or PR —
# a green-looking process that was not running. `main` is kept for a future
# rename rather than trading one silent miss for another.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: format · lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build app bundles
        run: npm run build
      - name: Install E2E system deps
        # Electron (launched by Playwright) needs the same system libs as the
        # Playwright browsers.
        run: npx playwright install-deps
      - name: GUI E2E over the real Electron app (dev bundle)
        # Runs smoke + full click-through against out/ (the packaged spec
        # auto-skips without dist/). Catches CSP/renderer regressions the headless
        # engine suite cannot see.
        run: xvfb-run -a npm run test:e2e

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Electron is declared as a devDependency but is the shipped runtime, so
      # omitting dev dependencies would silently skip the most important audit.
      - name: Full dependency audit (high+)
        run: npm audit --audit-level=high
      - name: Generate SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
