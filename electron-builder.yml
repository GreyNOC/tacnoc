# electron-builder packaging configuration.
#
# Build with: npm run dist   (runs `npm run build` first)
# Note: signing is intentionally NOT configured here. Per the GreyNOC release
# policy, shipping UNSIGNED artifacts is a decision for the operator — configure
# code signing (CSC_LINK / identity) before public distribution, or ship
# checksummed-only builds knowingly. See RELEASE.md.

appId: com.greynoc.tacnoc
productName: TACNOC
copyright: GreyNOC (authorized security research)

directories:
  output: dist
  buildResources: build

# The Electron main entry comes from package.json "main" (out/main/index.js),
# so the app must be built (electron-vite build) before packaging.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The example extension is read from disk at runtime (process.resourcesPath).
extraResources:
  - from: examples/extensions
    to: examples/extensions

# node-sqlite3-wasm ships a .wasm asset loaded at runtime; it must live outside
# the asar archive so it can be read from the filesystem.
asarUnpack:
  - node_modules/node-sqlite3-wasm/**

win:
  target:
    - target: nsis # installer (.exe)
      arch: [x64]
    - target: portable # single self-contained .exe, runs without installing
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# The NSIS installer and the portable build both emit a .exe, so give each a
# distinct artifactName — otherwise they collide on one filename in dist/.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}

portable:
  # Extract to a stable per-version dir under %TEMP% (not a random one each run).
  unpackDirName: TACNOC-${version}
  artifactName: ${productName}-${version}-Portable-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  # hardenedRuntime + notarization require an Apple identity; enable when signing.

linux:
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - tar.gz
# AppImage CANNOT be built from Windows: packaging it creates symlinks inside the
# image and Windows refuses those without Developer Mode or elevation, so the
# build dies with EPERM. `tar.gz` cross-builds from any host, so that is the
# Linux artifact a Windows workstation can produce — extract and run ./tacnoc.
# Build AppImage on Linux, or through the release.yml matrix. See RELEASE.md.

# Emit a per-build metadata file listing produced artifacts.
artifactBuildCompleted: null
